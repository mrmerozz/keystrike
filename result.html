<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your result | KeyStrike</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <a href="index.html" class="brand"><span class="brand__mark" aria-hidden="true"></span>KeyStrike</a>
      <span class="header__note" id="setupLabel"></span>
    </header>

    <section class="result">
      <p class="result__label">Words per minute</p>
      <p class="result__wpm" id="resWpm">0</p>
      <p class="result__verdict" id="resultRank"></p>
    </section>

    <dl class="result-grid">
      <div><dt>Accuracy</dt><dd id="resAcc">0%</dd></div>
      <div><dt>Correct characters</dt><dd id="resCorrect">0</dd></div>
      <div><dt>Mistakes</dt><dd id="resErrors">0</dd></div>
      <div><dt>Time</dt><dd id="resTime">0s</dd></div>
    </dl>

    <div class="actions actions--center">
      <a href="test.html" class="btn btn--primary">Try again<span class="arrow-icon" aria-hidden="true"></span></a>
      <a href="index.html" class="btn btn--quiet">Change settings</a>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/result.js"></script>
</body>
</html>
